<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number</title>
</head>
<body>

<script>
    var n = 153;
    var a = n;
    var s = 0;

    while (a > 0) {
        let digit = a % 10;
        s = s + digit * digit * digit;
        a = Math.floor(a / 10);
    }

    if (s == n) {
        document.write(n + " is an Armstrong Number");
    } else {
        document.write(n + " is not an Armstrong Number");
    }
</script>

</body>
</html>
